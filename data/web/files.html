<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIFFS Files</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: system-ui, sans-serif;
  margin: 0; padding: 0;
  background: #111; color: #eee;
  height: 100vh; overflow: hidden;
}
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  height: 100vh;
}
.sidebar {
  background: #0a0a0a;
  border-right: 1px solid #333;
  overflow-y: auto;
  padding: 8px;
}
.sidebar h2 {
  font-size: 13px;
  margin: 4px 0 8px;
  color: #aaa;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sidebar a.back {
  color: #6cf; font-size: 12px; text-decoration: none;
}
.folder {
  font-size: 12px;
  color: #888;
  cursor: pointer;
  padding: 4px 6px;
  margin-top: 4px;
  user-select: none;
}
.folder:hover { color: #fff; }
.folder::before { content: "▼ "; font-size: 10px; }
.folder.collapsed::before { content: "▶ "; }
.file-list { list-style: none; margin: 0; padding: 0 0 0 8px; }
.file-list.collapsed { display: none; }
.file {
  padding: 5px 8px;
  font-size: 12px;
  cursor: pointer;
  border-radius: 3px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}
.file:hover { background: #1a1a1a; }
.file.active { background: #234; color: #fff; }
.file .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.file .size { color: #666; font-size: 10px; flex-shrink: 0; }
.file.binary .name::before { content: "🔒 "; }
.file.editable .name::before { content: "✎ "; color: #5d8; }

.content {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
.toolbar {
  background: #1a1a1a;
  padding: 8px 12px;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.toolbar .path {
  font-family: ui-monospace, monospace;
  font-size: 12px;
  color: #6cf;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.toolbar .info { font-size: 11px; color: #888; }
.toolbar button {
  background: #264; border: none; color: #fff;
  padding: 6px 12px; border-radius: 3px; cursor: pointer;
  font-size: 12px;
}
.toolbar button:hover { background: #386; }
.toolbar button.secondary { background: #444; }
.toolbar button:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }

.viewer {
  flex: 1;
  overflow: auto;
  padding: 0;
  background: #0d0d0d;
  position: relative;
}
.viewer pre {
  margin: 0;
  padding: 12px;
  font-family: ui-monospace, monospace;
  font-size: 12px;
  white-space: pre;
  color: #ddd;
}
.viewer textarea {
  width: 100%;
  height: 100%;
  border: none;
  background: #0d0d0d;
  color: #ddd;
  font-family: ui-monospace, monospace;
  font-size: 12px;
  padding: 12px;
  resize: none;
  outline: none;
}
.empty {
  color: #555;
  font-size: 13px;
  padding: 40px 20px;
  text-align: center;
}
.binary-info {
  padding: 30px 20px;
  text-align: center;
  color: #888;
  font-size: 14px;
}
.binary-info .icon { font-size: 36px; margin-bottom: 12px; }
.status {
  padding: 6px 12px;
  font-size: 12px;
  background: #1a1a1a;
  border-top: 1px solid #333;
  color: #fc8;
  min-height: 1.6em;
  flex-shrink: 0;
}
.status.ok { color: #9d8; }
.status.err { color: #f88; }

@media (max-width: 600px) {
  .app { grid-template-columns: 160px 1fr; }
  .sidebar { padding: 4px; }
  .file { padding: 4px 6px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h2>
      <span>📂 SPIFFS</span>
      <a class="back" href="/">← Back</a>
    </h2>
    <div id="tree">Loading…</div>
  </div>

  <div class="content">
    <div class="toolbar">
      <span class="path" id="path">— select a file —</span>
      <span class="info" id="info"></span>
      <button id="btnEdit"  onclick="enterEditMode()" disabled>✎ Edit</button>
      <button id="btnSave"  onclick="saveFile()"      disabled style="display:none">💾 Save</button>
      <button id="btnCancel" class="secondary" onclick="cancelEdit()" style="display:none">✕ Cancel</button>
    </div>
    <div class="viewer" id="viewer">
      <div class="empty">Select a file from the sidebar.</div>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
// ================================================================
// State
// ================================================================
let allFiles = [];
let currentFile = null;
let currentRaw = '';
let isEditing = false;
let folderState = {};

// ================================================================
// Helpers
// ================================================================
function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = 'status' + (kind ? ' ' + kind : '');
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

// Editable files: JSON under /config/ only
function isEditable(path) {
  return path.startsWith('/config/') && path.endsWith('.json');
}

// Paths considered plain text for viewing
function isTextFile(path) {
  const lower = path.toLowerCase();
  return (
    lower.endsWith('.json') ||
    lower.endsWith('.txt') ||
    lower.endsWith('.html') ||
    lower.endsWith('.css') ||
    lower.endsWith('.js') ||
    lower.endsWith('.md') ||
    lower.endsWith('.csv') ||
    lower.endsWith('.xml')
  );
}

function isBinary(path) {
  return !isTextFile(path);
}

// "/config/wifi.json" → folder "/config/", name "wifi.json"
function splitPath(path) {
  const idx = path.lastIndexOf('/');
  if (idx <= 0) return { folder: '/', name: path.slice(1) };
  return { folder: path.slice(0, idx + 1), name: path.slice(idx + 1) };
}

// Pretty-print JSON, otherwise return raw text
function tryPrettyJson(text) {
  try {
    const obj = JSON.parse(text);
    return JSON.stringify(obj, null, 2);
  } catch (e) {
    return text;
  }
}

// ================================================================
// Build sidebar tree
// ================================================================
function buildTree(files) {
  const byFolder = {};
  for (const f of files) {
    const { folder } = splitPath(f.path);
    if (!byFolder[folder]) byFolder[folder] = [];
    byFolder[folder].push(f);
  }

  // Sort folder alphabetically; root '/' first
  const folders = Object.keys(byFolder).sort((a, b) => {
    if (a === '/') return -1;
    if (b === '/') return 1;
    return a.localeCompare(b);
  });

  const tree = document.getElementById('tree');
  tree.innerHTML = '';

  for (const folder of folders) {
    const folderId = 'fld_' + folder.replace(/[^a-z0-9]/gi, '_');
    const collapsed = folderState[folder] === true;

    const div = document.createElement('div');
    div.className = 'folder' + (collapsed ? ' collapsed' : '');
    div.textContent = folder === '/' ? 'root' : folder;
    div.onclick = () => toggleFolder(folder);
    tree.appendChild(div);

    const ul = document.createElement('ul');
    ul.className = 'file-list' + (collapsed ? ' collapsed' : '');
    ul.id = folderId;

    const sorted = byFolder[folder].sort((a, b) =>
      a.path.localeCompare(b.path)
    );

    for (const f of sorted) {
      const { name } = splitPath(f.path);
      const li = document.createElement('li');
      li.className = 'file';
      if (isBinary(f.path)) li.classList.add('binary');
      else if (isEditable(f.path)) li.classList.add('editable');
      if (currentFile === f.path) li.classList.add('active');

      li.innerHTML =
        '<span class="name" title="' + f.path + '">' + name + '</span>' +
        '<span class="size">' + fmtSize(f.size) + '</span>';
      li.onclick = () => openFile(f.path);
      ul.appendChild(li);
    }
    tree.appendChild(ul);
  }
}

function toggleFolder(folder) {
  folderState[folder] = !folderState[folder];
  buildTree(allFiles);
}

// ================================================================
// Load file list
// ================================================================
async function loadFileList() {
  setStatus('Loading file list…');
  try {
    const r = await fetch('/api/files');
    const j = await r.json();
    allFiles = j.files || [];
    buildTree(allFiles);
    setStatus(`${allFiles.length} files (${fmtSize(j.used)} / ${fmtSize(j.total)})`, 'ok');
  } catch (e) {
    setStatus(`Failed: ${e.message}`, 'err');
  }
}

// ================================================================
// Open file
// ================================================================
async function openFile(path) {
  if (isEditing) {
    if (!confirm('You have unsaved edits. Switch file anyway?')) return;
    cancelEditState();
  }

  currentFile = path;
  document.getElementById('path').textContent = path;

  // Update active highlight
  document.querySelectorAll('.file').forEach(el => el.classList.remove('active'));
  buildTree(allFiles);

  // Find size
  const f = allFiles.find(x => x.path === path);
  document.getElementById('info').textContent = f ? fmtSize(f.size) : '';

  const viewer = document.getElementById('viewer');
  const btnEdit = document.getElementById('btnEdit');
  btnEdit.disabled = !isEditable(path);

  // Binary file? Don't load content
  if (isBinary(path)) {
    viewer.innerHTML =
      '<div class="binary-info">' +
      '<div class="icon">🔒</div>' +
      '<div>Binary file</div>' +
      '<div style="margin-top:8px;font-size:12px;color:#666">' +
      (f ? fmtSize(f.size) : '?') + '</div>' +
      '</div>';
    setStatus('Binary file — preview not shown', 'ok');
    return;
  }

  // Text file: fetch & display
  setStatus('Loading file…');
  try {
    const r = await fetch('/api/file?path=' + encodeURIComponent(path));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    currentRaw = text;

    // JSON gets pretty-print; other files raw
    const display = path.endsWith('.json') ? tryPrettyJson(text) : text;

    const pre = document.createElement('pre');
    pre.textContent = display;
    viewer.innerHTML = '';
    viewer.appendChild(pre);

    setStatus(`Loaded: ${text.length} bytes`, 'ok');
  } catch (e) {
    viewer.innerHTML = '<div class="empty">Failed: ' + e.message + '</div>';
    setStatus('Error: ' + e.message, 'err');
  }
}

// ================================================================
// Edit mode (/config/*.json only)
// ================================================================
function enterEditMode() {
  if (!currentFile || !isEditable(currentFile)) return;

  isEditing = true;
  document.getElementById('btnEdit').style.display = 'none';
  document.getElementById('btnSave').style.display = '';
  document.getElementById('btnCancel').style.display = '';

  const viewer = document.getElementById('viewer');
  viewer.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.id = 'editor';
  ta.value = currentRaw;
  ta.spellcheck = false;
  viewer.appendChild(ta);
  ta.focus();

  setStatus('Edit mode — JSON must be valid', 'ok');
}

function cancelEditState() {
  isEditing = false;
  document.getElementById('btnEdit').style.display = '';
  document.getElementById('btnSave').style.display = 'none';
  document.getElementById('btnCancel').style.display = 'none';
  document.getElementById('btnEdit').disabled = !isEditable(currentFile);
}

function cancelEdit() {
  cancelEditState();
  if (currentFile) openFile(currentFile);
}

async function saveFile() {
  if (!currentFile || !isEditable(currentFile)) return;
  const ta = document.getElementById('editor');
  if (!ta) return;
  const newContent = ta.value;

  // Validate JSON before sending
  try {
    JSON.parse(newContent);
  } catch (e) {
    setStatus('Invalid JSON: ' + e.message, 'err');
    return;
  }

  setStatus('Saving…');
  try {
    const r = await fetch('/api/file?path=' + encodeURIComponent(currentFile), {
      method: 'PUT',
      headers: { 'Content-Type': 'text/plain; charset=UTF-8' },
      body: newContent
    });
    const txt = await r.text();
    if (!r.ok) {
      setStatus('Failed HTTP ' + r.status + ' — ' + txt, 'err');
      return;
    }
    setStatus('✓ Saved — ' + txt, 'ok');
    cancelEditState();
    // Refresh list (sizes may change)
    await loadFileList();
    // Reload current file (refresh display)
    await openFile(currentFile);
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
  }
}

// Keyboard shortcut: Ctrl/Cmd+S = save
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && isEditing) {
    e.preventDefault();
    saveFile();
  }
});

loadFileList();
</script>
</body>
</html>
