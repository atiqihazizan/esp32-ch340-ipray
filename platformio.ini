[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; src/i2c_scanner.cpp ialah sketsa berasingan — jangan gabung dengan main.cpp (dua setup/loop)
build_src_filter = +<*> -<i2c_scanner.cpp>
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv
; Tapis sdkconfig Arduino — lumpuhkan core dump ke flash (hilangkan E esp_core_dump_flash checksum)
board_build.sdkconfig_defaults = sdkconfig.defaults
; Port USB–UART CH340 (WCH) pada macOS — ubah jika nombor berbeza
upload_port = /dev/cu.wchusbserial120
monitor_port = /dev/cu.wchusbserial120
lib_deps =
    bblanchon/ArduinoJson @ ^7
    esphome/ESP32-audioI2S @ ^2.0.7
    adafruit/RTClib @ ^2.1.3
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    marzogh/SPIMemory @ ^3.4.0

; ; Imbasan I2C sahaja — `pio run -e i2c_scan -t upload`
; [env:i2c_scan]
; extends = esp32dev
; build_src_filter = +<*> -<main.cpp>